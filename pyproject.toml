[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenwise"
version = "0.1.0"
description = "Find where your Claude Code token spend goes and what you could save, all locally."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0",
    "scikit-learn>=1.7,<1.8",
    "numpy>=2.0",
    "pandas>=2.0",
    "platformdirs>=3.0",
    "skops>=0.11",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
tokenwise = "tokenwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokenwise = ["pricing.toml", "sql/*.sql", "baseline.skops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
