  <g fill="#222" text-anchor="middle">
    <text x="75" y="68" font-weight="600">Ingest</text><text x="75" y="88" font-size="11">session .jsonl, incremental</text>
    <text x="235" y="68" font-weight="600">DuckDB</text><text x="235" y="88" font-size="11">raw → turns / steps</text>
